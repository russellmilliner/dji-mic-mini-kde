[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-mic-mini-kde"
version = "0.2.0"
description = "KDE DJI Mic Mini Control — KDE Plasma 6 / Kirigami System Tray, DUML v1/v2 USB Telemetry, Hardware Controller & Desktop Alert Daemon for DJI Mic Mini (2ca3:4011)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Russell Milliner" }
]
keywords = ["dji", "dji-mic-mini", "kde", "plasma", "kirigami", "usb", "duml", "pipewire", "alsa"]
dependencies = [
    "PyQt6>=6.12.0",
]

[project.urls]
Homepage = "https://github.com/russellmilliner/dji-mic-mini-kde"
Repository = "https://github.com/russellmilliner/dji-mic-mini-kde"
Issues = "https://github.com/russellmilliner/dji-mic-mini-kde/issues"
Funding = "https://ko-fi.com/russellmilliner"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
